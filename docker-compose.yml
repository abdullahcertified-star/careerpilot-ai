services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: careerpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Distributed Cache & Scheduler Queue
  redis:
    image: redis:7-alpine
    container_name: careerpilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpilot_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - CHECKPOINTER_POSTGRES_URI=${CHECKPOINTER_POSTGRES_URI}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - resume_storage:/app/data/resumes
    ports:
      - "8000:8000"

  # Background Scanner & Workflow Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpilot_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - CHECKPOINTER_POSTGRES_URI=${CHECKPOINTER_POSTGRES_URI}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - resume_storage:/app/data/resumes
    command: ["python", "-m", "app.services.scheduler.worker"]

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerpilot_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  resume_storage:
